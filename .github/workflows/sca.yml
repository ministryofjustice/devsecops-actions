# Software Composition Analysis (SCA) Workflow
#
# Purpose:
#   Performs automated security composition analysis to identify vulnerabilities
#   in project dependencies and container images.
#
# Triggers:
#   - schedule: Daily at midnight (00:00 UTC)
#   - push: On pushes to main
#   - pull_request: When PRs target any branch
#   - workflow_dispatch: Manual workflow execution
#   - branch_protection_rule: When branch protection rules are modified
#   - workflow_call: When called as a reusable workflow by a consuming repository
#
# Permissions:
#   - contents: write - Required for updating dependency graphs
#   - pull-requests: write - Required for creating dependency review comments
#   - issues: write - Required for creating security advisories
#   - security-events: write - Required for uploading security scan results
#   - actions: read - Required for reading workflow run data
#
# Jobs:
#   setup:
#     - Prepares the infrastructure and environment configuration
#     - Outputs: environment name and timezone for downstream jobs
#
#   scan:
#     - Runs sequentially: dependency review, Renovate, MOJ secret scan,
#       TruffleHog, OpenSSF Scorecard, SBOM generation
#     - Fail-slow: all steps run regardless of individual step failures;
#       a gate step at the end fails the job if any scan step failed
#
#   analysis (matrix: owasp, codeql):
#     - OWASP Dependency-Check and CodeQL SAST run as parallel job instances
#     - Both instances always complete (fail-fast: false)
#
# Consumer usage (reusable workflow):
#   jobs:
#     sca:
#       uses: ministryofjustice/devsecops-actions/.github/workflows/sca.yml@<sha>
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#         security-events: write
#         actions: read
#       with:
#         dependency-review-config-file: ".github/dependency-review-config.yml"
#         docker-images-file: "sources.json"
#         dependency-check-suppression-file: "dependency-check-suppression.xml"
#       secrets: inherit
#
# Configuration:
#   - Environment: base (configurable via env vars)
#   - Timezone: Configurable via repository variables (TIMEZONE)
#   - Dependency review config: .github/dependency-review-config.yml
#   - Docker images config: sources.json
#
# Required Variables:
#   - TIMEZONE: Repository variable defining the timezone for operations
#   - NODE_VERSION: Node.js version for the runtime environment

name: SCA ⚡️
run-name: Software Composition Analysis ⚡️

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "**" # All branches

  workflow_dispatch:
  branch_protection_rule:

  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: ""
        description: "GitHub environment name for scoped secrets and variables"

      dependency-review-config-file:
        required: false
        type: string
        default: ""
        description: "Path to custom dependency review configuration file"

      docker-images-file:
        required: false
        type: string
        default: ""
        description: "Path to JSON file containing Docker image URIs for SBOM scanning"

      dependency-check-suppression-file:
        required: false
        type: string
        default: ""
        description: "Path to OWASP Dependency-Check suppression XML file"

      disable-node-audit:
        required: false
        type: string
        default: "false"
        description: "Whether to disable Node audit in OWASP Dependency-Check"

      disable-yarn-audit:
        required: false
        type: string
        default: "false"
        description: "Whether to disable Yarn audit in OWASP Dependency-Check"

      renovate:
        required: false
        type: string
        default: "true"
        description: "Enable or disable Renovate bot for automated dependency updates"

      codeql-languages:
        required: false
        type: string
        default: ""
        description: "Comma-separated list of CodeQL languages to analyse"

    secrets:
      token:
        required: false
        description: "GitHub token. Defaults to GITHUB_TOKEN via secrets: inherit"

permissions: {}

env:
  environment: base
  timezone: ${{ vars.TIMEZONE }}
  # Self-test defaults — used when triggered by push/PR/cron rather than workflow_call.
  # Job steps resolve config via: ${{ inputs.X || env.X }}
  DEPENDENCY_REVIEW_CONFIG: "./.github/dependency-review-config.yml"
  DOCKER_IMAGES_FILE: "${{ github.workspace }}/sources.json"
  DEPENDENCY_CHECK_SUPPRESSION: "dependency-check-suppression.xml"
  DISABLE_NODE_AUDIT: "true"

concurrency:
  group: sca-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Infrastructure 🔧
    runs-on: ["ubuntu-latest"]
    outputs:
      environment: ${{ env.environment }}
      timezone: ${{ env.timezone }}
    steps:
      - name: Environment 🧪
        run: echo "Environment set to ${{ env.environment }}"

      - name: Timezone 🌐
        run: echo "Timezone set to ${{ env.timezone }}"

  scan:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read

    name: Scan 🔍
    runs-on: ["ubuntu-latest"]
    needs: setup
    environment:
      name: ${{ inputs.environment || needs.setup.outputs.environment }}

    steps:
      - name: 📦 Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ github.workspace }}/package-lock.json

      - name: ⛓️ SLSA
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          security-patch-package-exclusion: "axios"

      - name: Install
        shell: bash
        run: npm ci --ignore-scripts --omit=dev

      # Scan steps run with continue-on-error + if: always() so all checks
      # complete in a single run. The gate step at the end fails the job if
      # any scan step reported a failure.

      - name: 📊 Dependencies
        id: dependencies
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/dependencies@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          dependency-review-config-file: ${{ inputs.dependency-review-config-file || env.DEPENDENCY_REVIEW_CONFIG }}

      - name: 🔁 Renovate
        id: renovate
        if: always() && (inputs.renovate || 'true') == 'true'
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/renovate@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}

      - name: 🔑 Secrets
        id: secrets
        if: always()
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/moj@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0

      - name: 🐷 TruffleHog
        id: trufflehog
        if: always()
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/trufflehog@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0

      - name: 🛡 OpenSSF
        id: ossf
        if: always()
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/ossf@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0

      - name: 📋 SBOM
        id: sbom
        if: always()
        continue-on-error: true
        uses: ministryofjustice/devsecops-actions/sca/sbom@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          docker-images-file: ${{ inputs.docker-images-file || env.DOCKER_IMAGES_FILE }}

      - name: Gate 🚦
        if: always()
        shell: bash
        run: |
          failed=""
          for step in dependencies renovate secrets trufflehog ossf sbom; do
            outcome=$(echo "$STEP_OUTCOMES" | jq -r ".$step // \"skipped\"")
            if [ "$outcome" = "failure" ]; then
              failed="$failed $step"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed scans:$failed"
            exit 1
          fi
        env:
          STEP_OUTCOMES: |
            {
              "dependencies": "${{ steps.dependencies.outcome }}",
              "renovate": "${{ steps.renovate.outcome }}",
              "secrets": "${{ steps.secrets.outcome }}",
              "trufflehog": "${{ steps.trufflehog.outcome }}",
              "ossf": "${{ steps.ossf.outcome }}",
              "sbom": "${{ steps.sbom.outcome }}"
            }

  analysis:
    permissions:
      contents: read
      security-events: write
      actions: read

    name: ${{ matrix.scan == 'owasp' && 'OWASP 🔎' || 'CodeQL ⚙️' }}
    runs-on: ["ubuntu-latest"]
    needs: setup
    strategy:
      matrix:
        scan: [owasp, codeql]
      fail-fast: false
    environment:
      name: ${{ inputs.environment || needs.setup.outputs.environment }}

    steps:
      - name: 📦 Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🔎 OWASP
        if: matrix.scan == 'owasp'
        uses: ministryofjustice/devsecops-actions/sca/owasp@c3200e456e3793277445313887ab658e06070078 # v1.5.0
        with:
          dependency-check-suppression-file: ${{ inputs.dependency-check-suppression-file || env.DEPENDENCY_CHECK_SUPPRESSION }}
          disable-node-audit: ${{ inputs.disable-node-audit || env.DISABLE_NODE_AUDIT }}
          disable-yarn-audit: ${{ inputs.disable-yarn-audit || 'false' }}

      - name: ⚙️ CodeQL
        if: matrix.scan == 'codeql'
        uses: ministryofjustice/devsecops-actions/sca/codeql@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          codeql-languages: ${{ inputs.codeql-languages || '' }}
