# GitHub Action for generating Software Bill of Materials (SBOM) using Syft
#
# This action scans repositories and Docker images to generate CycloneDX SBOM files.
# It uses Anchore Syft for scanning and supports both repository-level and Docker image scanning.
#
# Usage:
#   - uses: ministryofjustice/devsecops-actions/sca/steps/SBOM@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       node_version: "24.11.1"  # optional
#       docker-images-file: "images.json"  # optional
#
# Inputs:
#   token (required):
#     GitHub repository token with the following permissions:
#     - Read/Write: contents, pull requests, issues
#     - Read only: security events
#
#   node_version (optional):
#     Node.js version to use for npm operations.
#     Default: "24.11.1"
#
#   docker-images-file (optional):
#     Path to a JSON file containing an 'images' property with an array of Docker image URIs.
#     Example format: {"images": ["ghcr.io/ministryofjustice/devsecops-hooks:latest"]}
#     Default: "" (skips Docker image scanning)
#
# Outputs:
#   Uploads SBOM artifacts in CycloneDX JSON format:
#   - sca-sbom-repository.cdx.json: Repository-level SBOM
#   - sca-sbom-*.cdx.json: Additional SBOMs for Docker images (if docker-images-file is provided)
#
# Steps:
#   1. Installs Anchore Syft CLI tool
#   2. Scans the repository and generates SBOM
#   3. Sets up Node.js environment
#   4. Installs npm dependencies
#   5. Scans Docker images (if docker-images-file is provided)
#   6. Uploads all generated SBOM files as artifacts
#
# Example:
#   jobs:
#     sbom:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: ministryofjustice/devsecops-actions/sca/steps/SBOM@main
#           with:
#             token: ${{ secrets.GITHUB_TOKEN }}
#             docker-images-file: "docker-images.json"

name: ⛓️‍💥 SBOM
description: Software bill of material generation
author: Ministry of Justice UK

inputs:
  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

  node_version:
    required: false
    description: "Node.js version to use"
    default: "24.11.1"

  docker-images-file:
    required: false
    description: "A JSON file an 'images' property as an array containing URIs to docker image, for example 'ghcr.io/ministryofjustice/devsecops-hooks:latest'"
    default: ""

runs:
  using: composite

  steps:
    - name: Install
      shell: bash
      run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

    - name: Repository
      shell: bash
      run: syft scan ./ --config ${{ github.action_path }}/config.yml --source-name "${{ github.repository }}" --source-version "${{ github.sha }} --output cyclonedx-json=sca-sbom-repository.cdx.json"

    - name: Node
      uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5 # frozen: v6.1.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install
      shell: bash
      run: npm ci --ignore-scripts

    - name: Images
      if: ${{ inputs.docker-images-file != '' }}
      shell: bash
      run: npm run scan -- --images "${{ inputs.docker-images-file }}"

    - name: Upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # frozen: v6.0.0
      with:
        name: SBOM
        path: sca-sbom-*.cdx.json
