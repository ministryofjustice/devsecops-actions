# ==============================================================================
# GitHub Repository Archive Check - Composite Action
# ==============================================================================
#
# Copyright (c) Ministry of Justice UK
# SPDX-License-Identifier: MIT
#
# ==============================================================================
# DESCRIPTION
# ==============================================================================
# Automated repository health monitoring action that scans GitHub repository
# commit history to identify dormant repositories eligible for archival. Analyses
# repository activity patterns and dispatches email notifications when
# repositories have been inactive for a specified period, helping organisations
# maintain clean repository portfolios and proactive governance workflows.
#
# ==============================================================================
# FEATURES
# ==============================================================================
# - Automated commit history analysis
# - Configurable inactivity thresholds
# - GOV.UK Notify email integration
# - Non-destructive read-only scanning
# - Comprehensive activity reporting
# - Date-based eligibility detection
#
# ==============================================================================
# USAGE
# ==============================================================================
# Basic usage:
#   - uses: ministryofjustice/devsecops-actions/github/repository/archive@559ec2408860d9237cc472a5710e61c1c2187ffa
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       notification-email: "team@example.gov.uk"
#       gov-notify-key: ${{ secrets.GOV_NOTIFY_API_KEY }}
#       gov-notify-template-id: ${{ secrets.GOV_NOTIFY_TEMPLATE_ID }}
#
# With Node.js version from file:
#   - uses: ministryofjustice/devsecops-actions/github/repository/archive@559ec2408860d9237cc472a5710e61c1c2187ffa
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       node-version-file: "package.json"
#       notification-email: "team@example.gov.uk"
#       gov-notify-key: ${{ secrets.GOV_NOTIFY_API_KEY }}
#       gov-notify-template-id: ${{ secrets.GOV_NOTIFY_TEMPLATE_ID }}
#
# Advanced usage with custom threshold:
#   - uses: ministryofjustice/devsecops-actions/github/repository/archive@559ec2408860d9237cc472a5710e61c1c2187ffa
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       archival-days: "180"
#       notification-email: "governance@example.gov.uk"
#       gov-notify-key: ${{ secrets.GOV_NOTIFY_API_KEY }}
#       gov-notify-template-id: ${{ secrets.GOV_NOTIFY_TEMPLATE_ID }}
#
# ==============================================================================
# PREREQUISITES
# ==============================================================================
# - GitHub token with the following permissions:
#   - contents: read
# - GOV.UK Notify account with API key
# - GOV.UK Notify email template configured
# - Repository with commit history
#
# ==============================================================================
# OUTPUTS
# ==============================================================================
# This action generates the following:
# - Email notification via GOV.UK Notify (if repository exceeds threshold)
# - Console logs with repository activity status
# - Exit status indicating archival eligibility
#
# ==============================================================================
# VERSION INFORMATION
# ==============================================================================
# Action Version: 1.0.0
# Minimum GitHub Enterprise Server: 3.8
# Last Updated: 2026-02-10
#
# ==============================================================================

name: Ministry of Justice UK - GitHub - Archive check 🔎
description: Scan GitHub repository commit history to determine if repository is due for archival, then dispatch an alert email to the provided email address.
author: Ministry of Justice UK

inputs:
  archival-days:
    required: false
    description: "Number of inactivity days required before a repository is considered eligible for archival"
    default: "90"

  notification-email:
    required: true
    description: "Notification email address to send alerts when a repository has been dormant for the specified 'archival-days' and is therefore eligible for archival"

  gov-notify-key:
    required: true
    description: "GOV.UK Notify API key for sending email notifications"

  gov-notify-template-id:
    required: true
    description: "GOV.UK Notify email template ID for formatting archival notification messages"

  node-version:
    required: false
    description: "Node.js version to use. Specify the exact version number (e.g., '24.11.1'). If both `node-version` and `node-version-file` are provided, `node-version` takes precedence."
    default: ""

  node-version-file:
    required: false
    description: "File containing the version specification of the Node version to use. Examples: package.json, .nvmrc, .node-version, .tool-versions. If `node-version` and `node-version-file` are both defined the action will use version from node-version."

  token:
    required: true
    description: "GitHub token with read-only access to repository contents (for example, contents: read)."

runs:
  using: composite
  steps:
    - name: 📦 Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 📦 Action
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: "ministryofjustice/devsecops-actions"
        ref: "559ec2408860d9237cc472a5710e61c1c2187ffa"
        path: "559ec2408860d9237cc472a5710e61c1c2187ffa"

    - name: ⚡️ Node
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: "npm"
        cache-dependency-path: "559ec2408860d9237cc472a5710e61c1c2187ffa/package-lock.json"

    - name: ⚙️ Execute
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node 559ec2408860d9237cc472a5710e61c1c2187ffa/dist/index.js --github --archive --days "${{ inputs.archival-days }}" --email "${{ inputs.notification-email }}" --key "${{ inputs.gov-notify-key }}" --template-id "${{ inputs.gov-notify-template-id }}" --repository-name "${{ github.repository }}"
