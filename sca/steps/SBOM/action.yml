# This GitHub Action generates Software Bill of Materials (SBOM) for repositories and Docker images.
#
# The action performs the following steps:
# 1. Installs Syft - a tool for generating SBOMs from container images and filesystems
# 2. Scans the repository to generate an SBOM in CycloneDX JSON format
# 3. Sets up Node.js environment with the specified version
# 4. Scans Docker images (if provided) to generate additional SBOMs
# 5. Uploads all generated SBOM files as artifacts
#
# Inputs:
#   token: (required) GitHub repository token with read/write access to contents, pull requests,
#          issues, and read-only access to security events
#   node_version: (optional) Node.js version to use for scanning (default: 24.11.1)
#   docker-images-file: (optional) Path to a JSON file containing an 'images' property with an
#                       array of Docker image URIs (e.g., 'ghcr.io/ministryofjustice/devsecops-hooks:latest')
#
# Outputs:
#   Uploads SBOM files in CycloneDX JSON format (sbom-*.cdx.json) as artifacts with the name "📋 SBOM"
#
# Usage Example:
#   - uses: ministryofjustice/devsecops-actions/sca/steps/SBOM@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       node_version: "24.11.1"
#       docker-images-file: "docker-images.json"

name: ⛓️‍💥 SBOM
description: Software bill of material generation
author: Ministry of Justice UK

inputs:
  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

  node_version:
    required: false
    description: "Node.js version to use"
    default: "24.11.1"

  docker-images-file:
    required: false
    description: "A JSON file an 'images' property as an array containing URIs to docker image, for example 'ghcr.io/ministryofjustice/devsecops-hooks:latest'"
    default: ""

runs:
  using: composite

  steps:
    - name: Install
      shell: bash
      run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

    - name: Repository
      shell: bash
      run: syft scan ./ --base-path ${{ github.workspace }} --config ${{ github.action_path }}/config.yml --source-name "${{ github.repository }}" --source-version "${{ github.sha }} --output cyclonedx-json=sbom-repository.cdx.json"

    - name: Node
      uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5 # frozen: v6.1.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install
      shell: bash
      run: npm ci --ignore-scripts

    - name: Images
      shell: bash
      run: npm run scan -- --images "${{ inputs.docker-images-file }}"

    - name: Upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # frozen: v6.0.0
      with:
        name: 📋 SBOM
        path: sbom-*.cdx.json
