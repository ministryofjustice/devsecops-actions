# Trufflehog Composite Action
#
# This composite action runs Trufflehog filesystem scanning to detect secrets and sensitive information
# in the repository codebase.
#
# Inputs:
#   trufflehog-config-file:
#     description: Optional path to a Trufflehog configuration file for custom scan settings
#     required: false
#     default: "" (empty string - uses default Trufflehog configuration)
#
#   token:
#     description: GitHub repository token with the following permissions:
#                  - Read/Write: contents, pull requests, issues
#                  - Read-only: security events
#     required: true
#
# Steps:
#   1. Scan: Executes Trufflehog filesystem scan with the following options:
#      - Scans the entire current directory (./)
#      - Uses custom config if provided via trufflehog-config-file input
#      - Concurrency set to 14 threads
#      - Verification disabled (--no-verification)
#      - Auto-updates disabled (--no-update)
#      - Fails on scan errors (--fail-on-scan-errors)
#      - Outputs results to sca-trufflehog.json in JSON format
#
#   2. Upload: Uploads scan results as an artifact
#      - Always runs regardless of scan step outcome (if: always())
#      - Artifact name: "TruffleHog"
#      - Retention period: 30 days
#      - Uses pinned version of upload-artifact action (v6.0.0)
#
# Usage:
#   - name: Run Trufflehog Scan
#     uses: ministryofjustice/devsecops-actions/sca/steps/Trufflehog@<version>
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       trufflehog-config-file: .trufflehog.yml  # optional

name: 🐷 Trufflehog
description: Trufflehog scan
author: Ministry of Justice UK

inputs:
  trufflehog-config-file:
    required: false
    description: "Trufflehog configuration file path."
    default: ""

  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      run: |
        CONFIG=""

        if [ -n "${{ inputs.trufflehog-config-file }}" ]; then
          CONFIG="--config ${{ inputs.trufflehog-config-file }}"
        fi

        trufflehog filesystem ./ \
        $CONFIG \
        --concurrency=14 \
        --no-verification \
        --no-update \
        --fail-on-scan-errors \
        --json > sca-trufflehog.json

    - name: Upload
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: TruffleHog
        path: sca-trufflehog.json
        retention-days: 30
