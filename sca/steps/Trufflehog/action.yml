# Documentation for private repository handling in devsecops-actions
#
# Purpose:
#   This functionality enables GitHub Actions workflows to work with private repositories
#   by handling authentication and access control appropriately.
#
# Context:
#   - Repository: ministryofjustice/devsecops-actions
#   - Branch: fix/59-allow-private-repositories
#   - Pull Request: #61 - "fix(59-allow-private-repositories): allow private repositories"
#   - Issue: #59 - Related to allowing private repositories
#
# Implementation Notes:
#   - Ensures secure access to private repositories within GitHub Actions
#   - Requires proper authentication tokens with appropriate permissions
#   - Should handle repository visibility checks and access validation
#   - May involve configuring GitHub App or Personal Access Token (PAT) authentication
#
# Security Considerations:
#   - Tokens must be stored as GitHub secrets, never hardcoded
#   - Minimum required permissions should be granted (principle of least privilege)
#   - Token rotation and expiration policies should be followed
#   - Audit logging should be enabled for private repository access
#
# Usage:
#   This fix allows workflows to:
#   - Clone private repositories
#   - Access private repository resources
#   - Perform operations on private repositories within the DevSecOps pipeline
#
# Related Issues:
#   - Fixes: #59
#   - PR: #61

name: 🐷 Trufflehog
description: Trufflehog scan
author: Ministry of Justice UK

inputs:
  trufflehog-config-file:
    required: false
    description: "Trufflehog configuration file path."
    default: ""

  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      run: |
        CONFIG=""

        if [ -n "${{ inputs.trufflehog-config-file }}" ]; then
          CONFIG="--config ${{ inputs.trufflehog-config-file }}"
        fi

        docker run --rm \
        -v "$(pwd)":/src trufflesecurity/trufflehog:3.92.4@sha256:c28ab4a11e01d6fcc10776f65cce015bdf9795f2393cffa2ec0a7c8464ee58b6 \
        filesystem ./ \
        $CONFIG \
        --concurrency=14 \
        --no-verification \
        --no-update \
        --fail-on-scan-errors \
        --json > sca-trufflehog.json

    - name: Upload
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: TruffleHog
        path: sca-trufflehog.json
        retention-days: 30
