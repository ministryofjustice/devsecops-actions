# Software Composition Analysis (SCA) Workflow
#
# This workflow performs automated security scanning of software dependencies and components
# to identify vulnerabilities, license compliance issues, and outdated packages.
#
# Triggers:
#   - schedule: Runs daily at midnight (00:00 UTC)
#   - pull_request: Executes on pull requests targeting the main branch
#   - push: Runs on direct pushes to the main branch
#   - workflow_dispatch: Allows manual triggering from GitHub UI
#   - branch_protection_rule: Triggered by branch protection rule events
#
# Permissions:
#   The workflow requires minimal permissions at the workflow level (empty set),
#   but the job has specific permissions for:
#   - contents: write - To access and modify repository contents
#   - pull-requests: write - To comment on and update pull requests
#   - issues: write - To create and update security-related issues
#   - security-events: write - To upload security scanning results
#   - id-token: write - For OIDC token generation
#
# Steps:
#   1. Repository checkout: Clones the repository code
#   2. Node.js setup: Configures Node.js environment using version from repository variables
#   3. Install dependencies: Runs npm ci to install project dependencies without running scripts
#   4. Execute SCA: Runs the custom SCA action with:
#      - GitHub token for API access
#      - Optional dependency review configuration file
#      - Optional Docker images file for container scanning
#
# Configuration:
#   - Uses pinned versions of actions (frozen with commit SHA) for security
#   - Node version is configurable via repository variable NODE_VERSION
#   - Dependency review config can be customized via .github/dependency-review-config.yml
#   - Docker images for scanning can be specified via images.json

name: SCA ⚡️
run-name: Software Composition Analysis ⚡️

on:
  schedule:
    - cron: "0 0 * * *"

  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

  workflow_dispatch:
  branch_protection_rule:

permissions: {}

jobs:
  sca:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      id-token: write
      actions: read

    name: Execute ⚙️
    runs-on: ["ubuntu-latest"]

    steps:
      - name: Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # frozen: v6.0.1

      - name: Node
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5 # frozen: v6.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: ⚡️ SCA
        # uses: ministryofjustice/devsecops-actions/sca@c210b12f1bd77564cee5c5f5c7306cd63dc89867 # frozen: v1.2.0
        uses: ministryofjustice/devsecops-actions/sca@feat/10-sca-sbom
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Mandatory
          dependency-review-config-file: "./.github/dependency-review-config.yml" # Optional
          docker-images-file: ${{ github.workspace }}/sources.json # Optional
