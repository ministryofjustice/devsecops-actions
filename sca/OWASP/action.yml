name: 🔎 OWASP
description: OWASP dependency scan
author: Ministry of Justice UK

# This action performs dependency vulnerability scanning using OWASP Dependency-Check to identify
# known security vulnerabilities in project dependencies. It generates SARIF reports and uploads
# findings to GitHub Code Scanning for centralised vulnerability tracking and management.

inputs:
  token:
    required: true
    description: "GitHub repository token with read and write permissions for contents, pull requests, and issues, plus read-only access to security events."

runs:
  using: composite
  steps:
    - name: Scan
      uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # v1.1.0
      with:
        project: ${{ github.repository }}
        path: "."
        format: JSON
        args: >
          --failOnCVSS 7
          --prettyPrint
          --format SARIF
          --out ./reports

    - name: Upload
      if: always()
      uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
      with:
        sarif_file: ./reports/dependency-check-report.sarif
