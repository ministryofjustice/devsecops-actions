name: 🔑 Authenticate
description: Authenticate with GitHub using SSH
author: Ministry of Justice UK

inputs:
  ssh-key:
    required: true
    description: "GitHub repository ssh private key"

runs:
  using: composite
  steps:
    - name: Directory
      shell: bash
      run: mkdir -p ~/.ssh

    - name: Keys
      shell: bash
      run: echo "${{ inputs.ssh-key }}" > ~/.ssh/cruft

    - name: Hosts
      shell: bash
      run: echo ${{ vars.SSH_KNOWN_HOST_ED25519}} > ~/.ssh/known_hosts

    - name: Configuration
      shell: bash
      run: |
        cat << 'EOF' ~/.ssh/config
        Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/cruft
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          AddKeysToAgent no
          UseKeychain no
        EOF

    - name: Permissions
      shell: bash
      run: |
        chmod 600 ~/.ssh/cruft
        chmod 644 ~/.ssh/known_hosts
        chmod 600 ~/.ssh/config
