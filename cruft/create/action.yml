# ==============================================================================
# Cruft Update Pull Request - Template Synchronization Action
# ==============================================================================
#
# Copyright (c) Ministry of Justice UK
# SPDX-License-Identifier: MIT
#
# ==============================================================================
# DESCRIPTION
# ==============================================================================
# Orchestrates the template synchronisation workflow by detecting upstream
# template changes, applying updates, and creating automated pull requests
# with the synchronized modifications. This action runs cruft update to compare
# the current repository state with the upstream template, commits any changes
# with signed commits, and opens a pull request for review and merging.
#
# ==============================================================================
# FEATURES
# ==============================================================================
# - Automatic template update detection with cruft
# - Non-interactive update application (--skip-apply-ask)
# - Strict mode enforcement for consistency (--strict)
# - Dated branch naming for easy tracking
# - Optional GPG-signed commits
# - HTTPS token-based authentication for pushing changes
# - Automated pull request creation via GitHub API
# - Configurable base branch targeting
# - Customizable commit messages and headings
# - Proper Git configuration and authentication
#
# ==============================================================================
# USAGE
# ==============================================================================
# Basic usage:
#   - uses: ministryofjustice/devsecops-actions/cruft/create@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#
# With custom base branch:
#   - uses: ministryofjustice/devsecops-actions/cruft/create@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       base-branch: "develop"
#
# ==============================================================================
# PREREQUISITES
# ==============================================================================
# - Repository must contain .cruft.json file
# - Cruft must be installed (via install action)
# - Authentication must be configured (via authenticate action for private templates)
# - GitHub token with pull request write permissions
# - Git must be available in the runner environment
# - For signed commits: GPG signing key must be configured
#
# ==============================================================================
# WORKFLOW PROCESS
# ==============================================================================
# 1. Run cruft update to detect and apply template changes
# 2. Generate environment variables for branch naming
# 3. Configure Git user identity
# 4. Create new feature branch with date-based naming
# 5. Configure Git signing (if enabled)
# 6. Stage and commit all changes
# 7. Push changes to remote branch using token authentication
# 8. Create pull request via GitHub REST API
#
# ==============================================================================
# BRANCH NAMING CONVENTION
# ==============================================================================
# Format: chore/cookie-cutter-update-YYYYMMDD
# Example: chore/cookie-cutter-update-20260128
#
# This convention:
# - Groups template updates under 'chore' scope
# - Uses date suffix for uniqueness and tracking
# - Follows semantic commit conventions
#
# ==============================================================================
# PULL REQUEST DETAILS
# ==============================================================================
# Title: "chore(update): cruft update"
# Base: Specified base branch (default: main)
# Head: Generated branch name with date
# Body: Automatically generated by GitHub
#
# ==============================================================================
# TOOL INFORMATION
# ==============================================================================
# Tool: Cruft
# Documentation: https://cruft.github.io/cruft/
#
# ==============================================================================
# VERSION INFORMATION
# ==============================================================================
# Action Version: 1.0.0
# Last Updated: 2026-01-29
#
# ==============================================================================

name: ✏️ Create
description: Validates whether the template repository has been updated and creates a new pull request with synchronized changes if updates are available
author: Ministry of Justice UK

inputs:
  base-branch:
    required: false
    default: "main"
    description: "Target base branch where the pull request will be created and merged."

  target-branch-branch:
    required: false
    description: "Branch name to use when creating the pull request"
    default: "chore/cookie-cutter-update-$(date +%Y%m%d)"

  target-branch-commit-heading:
    required: false
    description: "Commit heading for the update pull request"
    default: "chore(update): cruft update"

  target-branch-commit-message:
    required: false
    description: "Commit message for the update pull request"
    default: "chore(update): cruft update"

  github-commit-user-name:
    required: false
    description: "GitHub commiting user name"
    default: "Ministry of Justice"

  github-commit-user-email:
    required: false
    description: "GitHub commiting user email address"
    default: ""

  github-app-id:
    required: false
    description: "GitHubApp ID"
    default: ""

  github-app-private-key:
    required: false
    description: "GitHubApp private key"
    default: ""

  github-app-owner:
    required: false
    description: "GitHub App organisation owner token scope"
    default: ""

  github-app-repositories:
    required: false
    description: "GitHub App organisation repositories token scope"
    default: ""

  token:
    required: false
    description: "GitHub repository token with read and write permissions for contents, pull requests, and issues, plus read-only access to security events."

runs:
  using: composite
  steps:
    - name: Update
      shell: bash
      run: cruft update --skip-apply-ask --strict

    - name: Token
      id: github-app-token-write
      if: inputs.github-app-id != '' && inputs.github-app-private-key != ''
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: "${{ inputs.github-app-id }}"
        private-key: "${{ inputs.github-app-private-key }}"
        owner: "${{ github.repository_owner }}"
        repositories: "${{ github.event.repository.name }}"
        permission-workflows: "write"
        permission-contents: "write"
        # permission-pull-requests: "write"

    # - name: Configure Git Authentication
    #   shell: bash
    #   env:
    #     APP_TOKEN: ${{ steps.github-app-token-write.outputs.token }}
    #     INPUT_TOKEN: ${{ inputs.token }}
    #   run: |
    #     if [ -n "$APP_TOKEN" ]; then
    #       git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"
    #     elif [ -n "$INPUT_TOKEN" ]; then
    #       git config --global url."https://x-access-token:${INPUT_TOKEN}@github.com/".insteadOf "https://github.com/"
    #     else
    #       echo "Error: No token provided for authentication"
    #       exit 1
    #     fi

    - name: Variables
      shell: bash
      run: |
        BASE="${{ inputs.base-branch }}"
        BRANCH="${{ inputs.target-branch-branch }}"

        echo "BASE=$BASE" >> "$GITHUB_ENV"
        echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

    - name: Configure
      shell: bash
      env:
        APP_TOKEN: ${{ steps.github-app-token-write.outputs.token }}
        INPUT_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ steps.github-app-token-write.outputs.app-slug }}
      run: |
        # Determine which token to use
        if [ -n "$APP_TOKEN" ]; then
          TOKEN="$APP_TOKEN"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"          
        elif [ -n "$INPUT_TOKEN" ]; then
          TOKEN="$INPUT_TOKEN"
          git config user.name "${{ inputs.github-commit-user-name }}"
          git config user.email "${{ inputs.github-commit-user-email }}"
        else
          echo "Error: No token provided for authentication"
          exit 1
        fi

        echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Sign
      shell: bash
      run: git config commit.gpgsign false

    - name: Branch
      shell: bash
      run: git switch -c $BRANCH

    - name: Commit
      shell: bash
      run: |
        git add .
        git commit -m "${{ inputs.target-branch-commit-message }}"

    - name: Push
      shell: bash
      run: |
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
        git push origin "$BRANCH"

    - name: PR
      shell: bash
      run: |
        curl -sSf \
        "https://api.github.com/repos/${{ github.repository }}/pulls" \
        -X POST \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Accept: application/vnd.github.v3+json" \
        -d '{
          "title": "${{ inputs.target-branch-commit-heading }}",
          "base": "'"$BASE"'",
          "head": "'"$BRANCH"'"
        }'
