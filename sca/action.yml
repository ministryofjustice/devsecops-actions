name: Ministry of Justice UK - SCA ⚡️
description: Software composition analysis GitHub action for dependency management, secret scanning, and security vulnerability detection
author: Ministry of Justice UK

# This composite action orchestrates a comprehensive software composition analysis (SCA) workflow
# that includes dependency review, security scanning, secret detection, and SBOM generation.
# It provides a holistic approach to identifying and managing security vulnerabilities and
# compliance risks within your codebase and dependencies.

inputs:
  renovate:
    required: false
    description: "Flag to enable or disable Renovate dependency update scanning. Set to 'false' to skip Renovate execution."
    default: "true"

  node_version:
    required: false
    description: "Node.js version to use for SBOM generation and related tooling. Specify the exact version number."
    default: "24.11.1"

  renovate-version:
    required: false
    description: "Renovate CLI version to use for dependency scanning. Specify the version number without the 'v' prefix."
    default: "42.64.1"

  dependency-review-config-file:
    required: false
    description: "Path to the configuration file for GitHub Actions dependency review. Leave empty to use default settings."
    default: ""

  trufflehog-config-file:
    required: false
    description: "Path to the TruffleHog configuration file for secret scanning customisation. Leave empty to use default settings."
    default: ""

  codeql-config-file:
    required: false
    description: "Path to the CodeQL configuration file for customising code analysis queries and settings. Leave empty to use default settings."
    default: ""

  codeql-upload-findings:
    required: false
    description: "Controls whether CodeQL findings are uploaded as SARIF files to GitHub Code Scanning. Set to 'never' if default setup is enabled to avoid conflicts."
    default: "always"

  docker-images-file:
    required: false
    description: "Path to a JSON file containing an 'images' property with an array of Docker image URIs to scan. Example: 'ghcr.io/ministryofjustice/devsecops-hooks:latest'."
    default: ""

  token:
    required: true
    description: "GitHub repository token with read and write permissions for contents, pull requests, and issues, plus read-only access to security events."

runs:
  using: composite
  steps:
    - name: 📦 Repository
      uses: ./repository

    - name: 📊 Dependencies
      uses: ./dependencies
      with:
        dependency-review-config-file: ${{ inputs.dependency-review-config-file }}

    - name: 🔎 OWASP
      uses: ./owasp

    - name: 🔁 Renovate
      if: ${{ inputs.renovate == 'true' }}
      uses: ./renovate
      with:
        token: ${{ inputs.token }}
        renovate-version: ${{ inputs.renovate-version }}

    - name: 🔑 Secrets
      uses: ./moj

    - name: 🐷 Trufflehog
      uses: ./trufflehog
      with:
        trufflehog-config-file: ${{ inputs.trufflehog-config-file }}

    - name: ⚙️ CodeQL
      uses: ./codeql
      with:
        codeql-config-file: ${{ inputs.codeql-config-file }}
        codeql-upload-findings: ${{ inputs.codeql-upload-findings }}

    - name: 🛡 OpenSSF
      uses: ./ossf
      with:
        token: ${{ inputs.token }}

    - name: 📋 SBOM
      uses: ./sbom
      with:
        token: ${{ inputs.token }}
        node_version: ${{ inputs.node_version }}
        docker-images-file: ${{ inputs.docker-images-file }}
