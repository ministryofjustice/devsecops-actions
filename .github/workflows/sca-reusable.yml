# Software Composition Analysis (SCA) - Reusable Workflow
#
# Purpose:
#   Reusable workflow that runs SCA checks with OWASP and CodeQL parallelised
#   alongside the remaining sequential tools, reducing overall wall-clock time.
#
# Usage (from a consuming repo):
#   jobs:
#     sca:
#       uses: ministryofjustice/devsecops-actions/.github/workflows/sca-reusable.yml@<sha>
#       with:
#         dependency-review-config-file: "./.github/dependency-review-config.yml"
#         docker-images-file: "${{ github.workspace }}/sources.json"
#         dependency-check-suppression-file: "dependency-check-suppression.xml"
#       secrets: inherit
#
# Jobs:
#   sca:
#     - Runs all tools except OWASP and CodeQL sequentially
#   owasp:
#     - Runs OWASP Dependency-Check in parallel
#   codeql:
#     - Runs CodeQL SAST in parallel
#
# Inputs (repo-specific only — all other settings are standardised):
#   - environment: GitHub environment name for scoped secrets/variables
#   - dependency-review-config-file: path to repo's dependency review config
#   - docker-images-file: path to JSON file listing Docker images to scan
#   - dependency-check-suppression-file: path to OWASP suppression XML
#
# Secrets:
#   - token: passed explicitly or via secrets: inherit (uses GITHUB_TOKEN)

name: SCA Reusable ⚡️

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: ""
        description: "GitHub environment name to apply to each job for environment-scoped secrets and variables"

      dependency-review-config-file:
        required: false
        type: string
        default: ""
        description: "Path to custom dependency review configuration file"

      docker-images-file:
        required: false
        type: string
        default: ""
        description: "Path to JSON file containing 'images' array with Docker image URIs for container SBOM generation"

      dependency-check-suppression-file:
        required: false
        type: string
        default: ""
        description: "The file path to the suppression XML file for OWASP Dependency-Check"

    secrets:
      token:
        required: false
        description: "GitHub repository token. Defaults to GITHUB_TOKEN via secrets: inherit"

jobs:
  sca:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      actions: read

    name: Execute ⚙️
    runs-on: ["ubuntu-latest"]
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install
        shell: bash
        run: npm ci --ignore-scripts --omit=dev

      - name: ⚡️ SCA
        uses: ./sca
        with:
          token: ${{ secrets.token }}
          dependency-review-config-file: ${{ inputs.dependency-review-config-file }}
          docker-images-file: ${{ inputs.docker-images-file }}
          dependency-check-suppression-file: ${{ inputs.dependency-check-suppression-file }}
          run-owasp: "false"
          run-codeql: "false"

  owasp:
    permissions:
      contents: read
      security-events: write

    name: OWASP 🔎
    runs-on: ["ubuntu-latest"]
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🔎 OWASP
        uses: ./sca/owasp
        with:
          dependency-check-suppression-file: ${{ inputs.dependency-check-suppression-file }}

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read

    name: CodeQL ⚙️
    runs-on: ["ubuntu-latest"]
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⚙️ CodeQL
        uses: ./sca/codeql
