# Workflow: SLSA ⛓️
# Description:
#   Runs a supply-chain prevention check on pull requests using the reusable
#   SLSA action from this repository.
#
# Features:
#   - Executes on all pull request branches
#   - Uses SHA-pinned actions for secure, repeatable builds
#   - Runs SLSA checks via the MoJ DevSecOps action set
#
# Usage:
#   - Place this file at .github/workflows/slsa.yml
#   - Configure repository variable NODE_VERSION for Node setup
#   - Open or update a pull request to trigger the checks
#
# Prerequisites:
#   - Repository access for GitHub Actions to read contents
#   - Valid npm lockfile at package-lock.json for dependency caching
#

name: SLSA ⛓️
run-name: Supply-chain prevention check ⛓️

on:
  schedule:
    - cron: "0 0 * * *"

  pull_request:
    branches:
      - "**" # All branches

permissions: {}

jobs:
  sca:
    permissions:
      contents: read

    name: Execute ⚙️
    runs-on: ["ubuntu-latest"]

    steps:
      - name: 📦 Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⛓️ SLSA
        uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0

      - name: Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ github.workspace }}/package-lock.json

      - name: Install
        shell: bash
        run: |
          set +e

          # Install malicious test package
          # Exit with non-zero code
          npm install safe-chain-test

          # Exit code
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "❌ SLSA check failed.";
          else
            echo "✅ SLSA check passed."
          fi
