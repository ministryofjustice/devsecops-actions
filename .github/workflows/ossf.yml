# OpenSSF Scorecard GitHub Action Workflow
# 
# Purpose:
#   Runs OpenSSF Scorecard security health metrics checks on the repository
#   to assess security best practices and upload results to GitHub Security tab.
#
# Triggers:
#   - schedule: Runs daily at midnight (00:00 UTC)
#   - push: Runs on pushes to the main branch
#   - branch_protection_rule: Runs when branch protection rules are modified
#
# Permissions:
#   Workflow level: None (empty permissions object for least privilege)
#   Job level:
#     - contents: read - Required to checkout repository code
#     - security-events: write - Required to upload SARIF results to Security tab
#     - id-token: write - Required for publishing scorecard results
#
# Concurrency:
#   Groups concurrent runs by workflow and ref to prevent multiple simultaneous executions.
#   Cancels in-progress runs when a new run is triggered.
#
# Steps:
#   1. Repository: Checks out the repository with full history (fetch-depth: 0)
#   2. Scan: Executes OSSF Scorecard analysis and generates SARIF output
#   3. Upload: Uploads SARIF results to GitHub Code Scanning for visualization
#
# Output:
#   - SARIF file (ossf.sarif) containing security health metrics
#   - Results published to repository's Security tab
#
# Dependencies:
#   - actions/checkout@v6.0.1 (frozen)
#   - ossf/scorecard-action@v2.4.3 (frozen)
#   - github/codeql-action/upload-sarif@v4.31.9 (frozen)

name: 🛡 OpenSSF
run-name: Open source security foundation scan

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches: ["main"]

  branch_protection_rule:

permissions: {}

concurrency:
  group: ossf-${{ github.workflow }}-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  ossf:
    permissions:
      contents: read
      security-events: write
      id-token: write

    name: Execute ⚙️
    runs-on: ["ubuntu-latest"]

    steps:
      - name: Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # frozen: v6.0.1
        with:
          fetch-depth: 0

      - name: Scan
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # frozen: v2.4.3
        with:
          results_file: ossf.sarif
          results_format: sarif
          publish_results: true
          api: 123buaysd890naosdhg8012nasdasd

      - name: Upload
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # frozen: v4.31.9
        with:
          sarif_file: ossf.sarif
