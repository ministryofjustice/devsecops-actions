# Software Composition Analysis (SCA) Workflow
#
# This workflow performs automated security scanning and dependency analysis for the repository.
# It runs on a scheduled basis, during pull requests, pushes to main, and can be triggered manually.
#
# Triggers:
#   - schedule: Daily at midnight (cron: "0 0 * * *")
#   - pull_request: On pull requests targeting the main branch
#   - push: On pushes to the main branch
#   - workflow_dispatch: Manual trigger
#   - branch_protection_rule: When branch protection rules are modified
#
# Environment Variables:
#   - environment: Deployment environment (default: base)
#   - timezone: Timezone configuration from repository variables
#
# Jobs:
#   1. setup:
#      - Configures infrastructure settings
#      - Sets environment and timezone
#      - Outputs configuration for downstream jobs
#      - Runs on: ubuntu-latest
#
#   2. sca:
#      - Executes Software Composition Analysis
#      - Permissions: Full access for contents, PRs, issues, security events, OIDC, and actions
#      - Dependencies: Requires setup job completion
#      - Steps:
#        * Checks out repository code
#        * Sets up Node.js environment using configured version
#        * Installs npm dependencies (ignoring scripts for security)
#        * Runs SCA action with:
#          - GitHub token for authentication
#          - Custom dependency review configuration
#          - Docker images sources file for container scanning
#      - Runs on: ubuntu-latest
#      - Environment: Uses output from setup job
#
# Permissions:
#   - Default: None (empty permissions at workflow level)
#   - SCA job: Elevated permissions for writing results and creating issues
#
# Notes:
#   - Currently using feature branch (feat/10-sca-sbom) for SCA action
#   - Docker images source file location: ./sources.json
#   - Dependency review config location: ./.github/dependency-review-config.yml

name: SCA ⚡️
run-name: Software Composition Analysis ⚡️

on:
  schedule:
    - cron: "0 0 * * *"

  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

  workflow_dispatch:
  branch_protection_rule:

permissions: {}

env:
  environment: base
  timezone: ${{ vars.TIMEZONE }}

jobs:
  setup:
    name: Infrastructure 🔧
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ env.environment }}
      timezone: ${{ env.timezone }}
    steps:
      - name: Environment 🧪
        run: echo "Environment set to ${{ env.environment }}"

      - name: Timezone 🌐
        run: echo "Timezone set to ${{ env.timezone }}"
  sca:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
      id-token: write
      actions: read

    name: Execute ⚙️
    runs-on: ["ubuntu-latest"]
    needs: setup
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # frozen: v6.0.1

      - name: Node
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5 # frozen: v6.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install
        shell: bash
        run: npm ci --ignore-scripts

      - name: ⚡️ SCA
        # uses: ministryofjustice/devsecops-actions/sca@c210b12f1bd77564cee5c5f5c7306cd63dc89867 # frozen: v1.2.0
        uses: ministryofjustice/devsecops-actions/sca@feat/10-sca-sbom
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Mandatory
          dependency-review-config-file: "./.github/dependency-review-config.yml" # Optional
          docker-images-file: ./sources.json # Optional
