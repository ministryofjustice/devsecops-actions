# Documentation:
# - Workflow: "Lint check ✏️" runs on pull requests targeting main.
# - Global env: sets base environment and timezone from repository variables.
# - Job: setup initializes and outputs environment/timezone for downstream jobs.
# - Job: lint checks out code, sets up Node, installs dependencies, and runs
#   markdown, YAML, TypeScript, and Renovate validations.
# - Permissions: top-level empty; lint job grants read-only contents access.

name: Lint check ✏️
run-name: Lint check ✏️

on:
  pull_request:
    branches: ["main"]

permissions: {}

env:
  environment: base
  timezone: ${{ vars.TIMEZONE }}

jobs:
  # 1. Setup test infrastructure
  setup:
    name: Infrastructure 🔧
    runs-on: ["ubuntu-latest"]
    outputs:
      environment: ${{ env.environment }}
      timezone: ${{ env.timezone }}
    steps:
      - name: Environment 🧪
        run: echo "Environment set to ${{ env.environment }}"

      - name: Timezone 🌐
        run: echo "Timezone set to ${{ env.timezone }}"

  # 2. Various lint checks
  lint:
    permissions:
      contents: read

    name: Lint ✏️
    needs: setup
    environment:
      name: ${{ needs.setup.outputs.environment }}
    runs-on: ["ubuntu-latest"]

    steps:
      - name: Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install
        shell: bash
        run: npm ci --ignore-scripts

      - name: MD
        shell: bash
        run: npm run validate:md

      - name: YML
        shell: bash
        run: npm run validate:yml

      - name: TS
        shell: bash
        run: npm run validate:ts

      - name: Renovate
        shell: bash
        run: npm run validate:renovate
