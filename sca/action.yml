# This GitHub composite action performs comprehensive Software Composition Analysis (SCA)
# for repositories, including dependency management, security scanning, and SBOM generation.
#
# The action orchestrates multiple security and compliance checks in sequence:
# - Repository checkout and setup
# - Dependency review using GitHub's native dependency review
# - OWASP dependency checking for known vulnerabilities
# - Automated dependency updates via Renovate (optional)
# - Secret scanning using GitHub's native capabilities
# - Trufflehog for additional secret detection
# - CodeQL for semantic code analysis
# - OpenSSF Scorecard for security best practices assessment
# - Software Bill of Materials (SBOM) generation
#
# Usage:
#   - uses: ministryofjustice/devsecops-actions/sca@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       renovate: 'true'
#       docker-images-file: 'path/to/images.json'
#
# Inputs:
#   renovate: Enable/disable Renovate dependency updates (default: true)
#   node_version: Node.js runtime version for SBOM generation (default: 24.11.1)
#   renovate-version: Renovate CLI version (default: 42.64.1)
#   dependency-review-config-file: Path to custom dependency review config
#   trufflehog-config-file: Path to custom Trufflehog config
#   codeql-config-file: Path to custom CodeQL config
#   codeql-upload-findings: Control SARIF upload to Code Scanning (default: always)
#   docker-images-file: JSON file with docker image URIs for SBOM generation
#   token: GitHub token with appropriate permissions (required)
#
# Required Token Permissions:
#   - contents: read/write
#   - pull-requests: read/write
#   - issues: read/write
#   - security-events: read
#
# Note: This action is designed to run as part of a CI/CD pipeline and requires
# appropriate GitHub Advanced Security features to be enabled for full functionality.

name: Ministry of Justice UK - SCA ⚡️
description: Software composition analysis GitHub action for dependency management, secret scanning, and security vulnerability detection
author: Ministry of Justice UK

inputs:
  renovate:
    required: false
    description: "Flag to evaluation Renovate execution"
    default: "true"

  node_version:
    required: false
    description: "Node.js version to use"
    default: "24.11.1"

  renovate-version:
    required: false
    description: "Renovate CLI version, an optional argument which defaults to v42.64.1."
    default: "42.64.1"

  dependency-review-config-file:
    required: false
    description: "GitHub Actions dependency review configuration file path."
    default: ""

  trufflehog-config-file:
    required: false
    description: "Trufflehog configuration file path."
    default: ""

  codeql-config-file:
    required: false
    description: "CodeQL configuration file path."
    default: ""

  codeql-upload-findings:
    required: false
    description: "Upload the findings from CodeQL as SARIF file to Code Scanning, set to never if default setup is enabled."
    default: "always"

  docker-images-file:
    required: false
    description: "A JSON file an 'images' property as an array containing URIs to docker image, for example 'ghcr.io/ministryofjustice/devsecops-hooks:latest'"
    default: ""

  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

runs:
  using: composite
  steps:
    - name: 📦 Repository
      uses: ./sca/steps/Repository

    - name: 📊 Dependencies
      uses: ./sca/steps/Dependencies
      with:
        dependency-review-config-file: ${{ inputs.dependency-review-config-file }}

    - name: 🔎 OWASP
      uses: ./sca/steps/OWASP

    - name: 🔁 Renovate
      if: inputs.renovate == 'true'
      uses: ./sca/steps/Renovate
      with:
        token: ${{ inputs.token }}
        renovate-version: ${{ inputs.renovate-version }}

    - name: 🔑 Secrets
      uses: ./sca/steps/Secrets

    - name: 🐷 Trufflehog
      uses: ./sca/steps/Trufflehog
      with:
        trufflehog-config-file: ${{ inputs.trufflehog-config-file }}

    - name: ⚙️ CodeQL
      uses: ./sca/steps/CodeQL
      with:
        codeql-config-file: ${{ inputs.codeql-config-file }}
        codeql-upload-findings: ${{ inputs.codeql-upload-findings }}

    - name: 🛡 OpenSSF
      uses: ./sca/steps/OpenSSF
      with:
        token: ${{ inputs.token }}

    - name: 📋 SBOM
      uses: ./sca/steps/SBOM
      with:
        token: ${{ inputs.token }}
        node_version: ${{ inputs.node_version }}
        docker-images-file: ${{ inputs.docker-images-file }}
