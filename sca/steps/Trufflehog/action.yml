# This GitHub Action performs a Trufflehog scan to detect secrets and sensitive information in the repository.
#
# The action performs the following steps:
# 1. Sets up Node.js environment with the specified version
# 2. Installs npm dependencies and Trufflehog tool
# 3. Runs Trufflehog filesystem scan with configurable settings
# 4. Uploads scan results as an artifact
#
# Inputs:
#   trufflehog-config-file: (optional) Path to custom Trufflehog configuration file
#   node_version: (optional) Node.js version to use (default: "24.11.1")
#   token: (required) GitHub token with read/write access to contents, pull requests, issues, and read-only access to security events
#
# Outputs:
#   - Artifact: sca-trufflehog.json containing scan results (retained for 30 days)
#
# Scan Configuration:
#   - Concurrency: 14 threads
#   - Verification: Disabled
#   - Auto-update: Disabled
#   - Fails on scan errors
#   - Output format: JSON
#
# Example usage:
#   - uses: ministryofjustice/devsecops-actions/sca/steps/Trufflehog@main
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#       trufflehog-config-file: .trufflehog.yml

name: 🐷 Trufflehog
description: Trufflehog scan
author: Ministry of Justice UK

inputs:
  trufflehog-config-file:
    required: false
    description: "Trufflehog configuration file path."
    default: ""

  node_version:
    required: false
    description: "Node.js version to use"
    default: "24.11.1"

  token:
    required: true
    description: "GitHub repostiroy token with read and write privileges to contents, pull request, issues and read only perimission to security events."

runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5 # v6.1.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install
      shell: bash
      run: |
        npm ci --ignore-scripts
        npm run install:trufflehog

    - name: Scan
      shell: bash
      run: |
        CONFIG=""

        if [ -n "${{ inputs.trufflehog-config-file }}" ]; then
          CONFIG="--config ${{ inputs.trufflehog-config-file }}"
        fi

        trufflehog filesystem ${{ github.workspace }} \
        $CONFIG \
        --concurrency=14 \
        --no-verification \
        --no-update \
        --fail-on-scan-errors \
        --json > sca-trufflehog.json

    - name: Upload
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: TruffleHog
        path: sca-trufflehog.json
        retention-days: 30
