# ==============================================================================
# Commit Validation - Composite GitHub Action
# ==============================================================================
#
# Copyright (c) Ministry of Justice UK
# SPDX-License-Identifier: MIT
#
# ==============================================================================
# DESCRIPTION
# ==============================================================================
# Comprehensive commit validation action that enforces security and quality
# standards for Git commits. This composite action performs two critical
# validations: cryptographic signature verification and conventional commit
# message format validation, ensuring code integrity and traceability.
#
# ==============================================================================
# FEATURES
# ==============================================================================
# - Conventional commit message validation using commitlint
# - Commit signature verification (GPG/SSH)
# - Signature presence detection (without public key import)
# - Custom commitlint configuration support
# - Fast validation with detailed error messages
# - Zero-configuration operation with sensible defaults
#
# ==============================================================================
# USAGE
# ==============================================================================
# Basic usage:
#   - uses: ministryofjustice/devsecops-actions/github/commit@9babea875cafae0e3b05a5ec5aca76d6b560c42e
#
# With Node.js version from file:
#   - uses: ministryofjustice/devsecops-actions/github/commit@9babea875cafae0e3b05a5ec5aca76d6b560c42e
#     with:
#       node-version-file: "package.json"
#
# Advanced usage with custom configuration:
#   - uses: ministryofjustice/devsecops-actions/github/commit@9babea875cafae0e3b05a5ec5aca76d6b560c42e
#     with:
#       config-file: ".github/commitlint.config.js"
#       node-version: "24.11.1"
#
# ==============================================================================
# PREREQUISITES
# ==============================================================================
# - Repository must be checked out with full Git history
# - Commits must be signed locally before pushing (GPG or SSH)
# - Commit messages must follow conventional commits specification
#
# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
# 1. Conventional Commit Format:
#    - Validates commit message against conventional commits specification
#    - Enforces format: type(scope): subject
#    - Supports custom rules via commitlint configuration
#
# 2. Commit Signature:
#    - Checks for presence of GPG or SSH signature
#    - Does NOT verify signature validity or authenticity
#    - Does NOT require public key import in CI environment
#    - Detects: "gpg: Signature made" or "BEGIN PGP SIGNATURE"
#
# ==============================================================================
# VERSION INFORMATION
# ==============================================================================
# Action Version: 1.0.0
# Minimum GitHub Enterprise Server: 3.8
# Last Updated: 2026-02-26
#
# ==============================================================================

name: Ministry of Justice UK - GitHub - Commit check 🔎
description: Validate whether the commit is signed and commit message is constructed in conventional commit format
author: Ministry of Justice UK

inputs:
  config-file:
    required: false
    description: "Commitlint configuration file, supplied to --config argument."

  node-version:
    required: false
    description: "Node.js version to use. Specify the exact version number (e.g., '24.11.1'). If both `node-version` and `node-version-file` are provided, `node-version` takes precedence."
    default: ""

  node-version-file:
    required: false
    description: "File containing the version specification of the Node version to use. Examples: package.json, .nvmrc, .node-version, .tool-versions. If `node-version` and `node-version-file` are both defined the action will use version from `node-version` input."
    default: ""

runs:
  using: composite
  steps:
    - name: 📦 Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: 📦 Action
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: "ministryofjustice/devsecops-actions"
        ref: "8c77d3a65a46d1d4b5416eafae5b84371ecd797d"
        path: "8c77d3a65a46d1d4b5416eafae5b84371ecd797d"

    - name: ⚡️ Node
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: "npm"
        cache-dependency-path: "8c77d3a65a46d1d4b5416eafae5b84371ecd797d/package-lock.json"

    - name: ⛓️ SLSA
      uses: ministryofjustice/devsecops-actions/sca/slsa@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
      with:
          security-patch-package-exclusion: "axios"

    - name: ⚙️ Install
      shell: bash
      working-directory: 8c77d3a65a46d1d4b5416eafae5b84371ecd797d
      run: npm ci --ignore-scripts

    - name: 🧩 Conventional
      shell: bash
      working-directory: 8c77d3a65a46d1d4b5416eafae5b84371ecd797d
      run: git -C "$GITHUB_WORKSPACE" --no-pager log -1 --no-show-signature --pretty=%s | npm run validate:commit:message -- --config ${{ inputs.config-file && format('"{0}"', inputs.config-file) || 'commitlint.config.js' }}

    - name: 🔐 Signed
      shell: bash
      working-directory: 8c77d3a65a46d1d4b5416eafae5b84371ecd797d
      run: |
        git -C "$GITHUB_WORKSPACE" --no-pager log -1 --show-signature --pretty=%s | grep -Eq "gpg: Signature made|BEGIN PGP SIGNATURE" || { echo "❌ Commit is unsigned!"; exit 1; }
